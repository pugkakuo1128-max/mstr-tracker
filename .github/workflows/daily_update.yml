name: Daily MSTR Dashboard Update

on:
  schedule:
    # 每個美股交易日收盤後執行 (台北時間週二至週六早上 05:30)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動按按鈕觸發測試

jobs:
  update-chart:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install yfinance requests pandas numpy

      - name: 執行更新腳本
        run: |
          python update_dashboard.py

      - name: 自動提交並推播更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update MSTR dashboard: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
